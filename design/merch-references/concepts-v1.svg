<svg viewBox="0 0 780 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Three tee design directions for Hasna's Coffee</title>
<desc id="dsc">Three boxy tee mockups: a Buna Club back print in cream on espresso, a small Abol Tona Baraka chest hit in espresso on cream, and a jebena silhouette back print in cream on espresso.</desc>

<!-- Type here renders in Georgia / system sans as a stand-in for Playfair Display / Inter.
     Structure is final; typeface is not. -->

<defs>
<path id="tee" d="M70,22 L95,22 Q120,44 145,22 L170,22 L215,45 L215,95 L178,108 L178,250 L62,250 L62,108 L25,95 L25,45 Z"/>
</defs>

<!-- ============ A: BUNA CLUB ============ -->
<g transform="translate(10,20)">
<use href="#tee" fill="#1A0C05" stroke="#1A0C05" stroke-width="1"/>
<g text-anchor="middle" fill="#F8F4EE">
<text x="120" y="96" font-family="system-ui,sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.2">HASNA'S</text>
<text x="120" y="109" font-family="Georgia,serif" font-size="8" font-style="italic" opacity="0.82">Ethiopian Coffee House · Austin</text>
</g>
<g stroke-linecap="round">
<line x1="82" y1="119" x2="158" y2="119" stroke="#4A7C59" stroke-width="1.3"/>
<line x1="82" y1="122.5" x2="158" y2="122.5" stroke="#B8860B" stroke-width="1.3"/>
<line x1="82" y1="126" x2="158" y2="126" stroke="#9E2B25" stroke-width="1.3"/>
</g>
<g text-anchor="middle" fill="#F8F4EE" font-family="system-ui,sans-serif" font-weight="800" letter-spacing="-1">
<text x="120" y="160" font-size="31">BUNA</text>
<text x="120" y="188" font-size="31">CLUB</text>
</g>
<g text-anchor="middle" fill="#F8F4EE">
<text x="120" y="209" font-family="Georgia,serif" font-size="8.5" font-style="italic" opacity="0.85">Abol · Tona · Baraka</text>
<text x="120" y="222" font-family="system-ui,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.8" opacity="0.7">EST. 2024</text>
</g>
</g>

<!-- ============ B: ABOL TONA BARAKA ============ -->
<!-- Blocked until a dark-ink logo variant exists — see DESIGN_LANGUAGE.md §7 -->
<g transform="translate(270,20)">
<use href="#tee" fill="#F8F4EE" stroke="#1A0C05" stroke-width="1" stroke-opacity="0.28"/>
<g text-anchor="middle" fill="#1A0C05" font-family="Georgia,serif" letter-spacing="3">
<text x="120" y="104" font-size="14">ABOL</text>
<text x="120" y="122" font-size="14">TONA</text>
<text x="120" y="140" font-size="14">BARAKA</text>
</g>
<line x1="103" y1="150" x2="137" y2="150" stroke="#B8860B" stroke-width="1.1"/>
<text x="120" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" font-weight="600" letter-spacing="1.4" fill="#6B4F3A">THE THREE ROUNDS</text>
</g>

<!-- ============ C: JEBENA ============ -->
<g transform="translate(530,20)">
<use href="#tee" fill="#1A0C05" stroke="#1A0C05" stroke-width="1"/>
<g stroke-linecap="round">
<line x1="88" y1="88" x2="152" y2="88" stroke="#4A7C59" stroke-width="1.3"/>
<line x1="88" y1="91.5" x2="152" y2="91.5" stroke="#B8860B" stroke-width="1.3"/>
<line x1="88" y1="95" x2="152" y2="95" stroke="#9E2B25" stroke-width="1.3"/>
</g>
<g fill="#F8F4EE">
<circle cx="120" cy="178" r="30"/>
<path d="M113,152 L113,131 L127,131 L127,152 Z"/>
<path d="M109,131 L131,131 L120,119 Z"/>
<circle cx="120" cy="116" r="2.8"/>
</g>
<path d="M144,160 Q163,152 158,133" fill="none" stroke="#F8F4EE" stroke-width="4.5" stroke-linecap="round"/>
<path d="M94,158 Q76,172 87,191" fill="none" stroke="#F8F4EE" stroke-width="4.5" stroke-linecap="round"/>
<g text-anchor="middle" fill="#F8F4EE" font-family="system-ui,sans-serif">
<text x="120" y="228" font-size="9" font-weight="700" letter-spacing="3">HASNA'S</text>
<text x="120" y="240" font-size="6" font-weight="600" letter-spacing="1.6" opacity="0.72">BUNA · AUSTIN, TX</text>
</g>
</g>

<!-- labels -->
<g text-anchor="middle" font-family="system-ui,sans-serif" fill="#9E8070" font-size="10.5">
<text x="130" y="300" font-weight="700" fill="#8a7a6d">A · Buna Club</text>
<text x="130" y="316" font-size="9.5">Back print · cream on espresso</text>
<text x="390" y="300" font-weight="700" fill="#8a7a6d">B · Abol Tona Baraka</text>
<text x="390" y="316" font-size="9.5">Chest hit · espresso on cream</text>
<text x="650" y="300" font-weight="700" fill="#8a7a6d">C · Jebena</text>
<text x="650" y="316" font-size="9.5">Back print · cream on espresso</text>
</g>
</svg>
